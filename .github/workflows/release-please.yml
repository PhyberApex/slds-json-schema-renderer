name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish to npm (for example v1.5.74)
        required: true
        type: string

concurrency:
  group: release-please
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  pages: write
  id-token: write

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

  checks:
    if: needs.release-please.outputs.release_created == 'true'
    needs: release-please
    uses: ./.github/workflows/checks.yml

  publish:
    if: >-
      !cancelled() && (
        github.event_name == 'workflow_dispatch'
        || (needs.checks.result == 'success' && needs.release-please.outputs.release_created == 'true')
      )
    needs: [release-please, checks]
    runs-on: ubuntu-latest
    environment: Publish
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Publish to npm via trusted publishing
        env:
          NPM_CONFIG_LOGLEVEL: ${{ runner.debug == '1' && 'verbose' || 'notice' }}
        run: npm publish --provenance --access public

  pages:
    if: needs.release-please.outputs.release_created == 'true'
    needs: [release-please, checks]
    uses: ./.github/workflows/pages.yml
